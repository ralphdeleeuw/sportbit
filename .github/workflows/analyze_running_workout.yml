name: Analyze Running Workout

on:
  # Kostenbesparing: niet meer automatisch na élke health-refresh (was workflow_run).
  # Analyse gebeurt on-demand via de knop in de PWA (workflow_dispatch).
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modus: analyze (default) of apply'
        required: false
        default: 'analyze'
        type: choice
        options:
          - analyze
          - apply

# Eén run tegelijk per Gist-bestandsgroep: voorkomt dat twee workflows
# hetzelfde bestand lezen en elkaars wijzigingen overschrijven.
concurrency:
  group: gist-running
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Analyze running workout
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
        run: python3 analyze_running_workout.py --mode=${{ github.event.inputs.mode || 'analyze' }}

      - name: Meld mislukte run
        if: failure()
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
        run: pip install -q requests pywebpush && python3 notify_failure.py

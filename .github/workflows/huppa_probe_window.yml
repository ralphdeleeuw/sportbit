name: Huppa Boekingsvenster Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Probe boekingsvenster
        env:
          HUPPA_EMAIL: ${{ secrets.HUPPA_EMAIL }}
          HUPPA_PASSWORD: ${{ secrets.HUPPA_PASSWORD }}
          HUPPA_SUBDOMAIN: ${{ secrets.HUPPA_SUBDOMAIN }}
        run: python3 huppa_probe_window.py

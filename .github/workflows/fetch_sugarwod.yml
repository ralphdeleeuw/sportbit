name: Fetch SugarWOD

on:
  schedule:
    # Eén keer per dag, 04:37 UTC (05:37 winter / 06:37 zomer Amsterdam).
    # Bewust geen :00 — GitHub vertraagt runs op het hele uur sterk (zag 7+ uur).
    # Eerder stonden hier twee crons (05:00 én 06:00 UTC) die béide dagelijks draaiden.
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      skip_ai:
        description: 'AI coaching overslaan (sneller)'
        required: false
        default: 'false'
        type: boolean
      skip_myfitnesspal:
        description: 'MyFitnessPal data overslaan'
        required: false
        default: 'false'
        type: boolean

# Eén run tegelijk per Gist-bestandsgroep: voorkomt dat twee workflows
# hetzelfde bestand lezen en elkaars wijzigingen overschrijven.
concurrency:
  group: gist-wod
  cancel-in-progress: false

jobs:
  fetch-wod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 playwright anthropic pywebpush

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Fetch SugarWOD data and save to Gist
        env:
          SUGARWOD_EMAIL: ${{ secrets.SUGARWOD_EMAIL }}
          SUGARWOD_PASSWORD: ${{ secrets.SUGARWOD_PASSWORD }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WAQI_API_TOKEN: ${{ secrets.WAQI_API_TOKEN }}
          MFP_USERNAME: ${{ secrets.MFP_USERNAME }}
          MFP_PASSWORD: ${{ secrets.MFP_PASSWORD }}
          # Kostenbesparing: op de geplande (dagelijkse) run wordt de WOD-data wél
          # opgehaald, maar AI-coaching overgeslagen. Bij handmatige dispatch vanuit de
          # PWA bepaalt de skip_ai-invoer het (standaard false → AI draait on-demand).
          SKIP_AI: ${{ github.event_name == 'schedule' && 'true' || (inputs.skip_ai || 'false') }}
          SKIP_MYFITNESSPAL: ${{ inputs.skip_myfitnesspal || 'false' }}
          # HEALTH_ONLY is false (default): alleen SugarWOD ophalen, gecachte health data uit Gist gebruiken
        run: python3 fetch_sugarwod.py

      - name: Meld mislukte run
        if: failure()
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
        run: pip install -q requests pywebpush && python3 notify_failure.py

name: CrossFit Auto Sign-Up (Huppa)

on:
  schedule:
    # GitHub start runs rond 00:00 UTC vaak uren te laat (gezien: 3,5–6,5 uur).
    # Daarom meerdere momenten, buiten het drukke middernacht-UTC-uur. Elke run is
    # veilig te herhalen: al geboekte lessen worden overgeslagen.
    - cron: "13 23 * * *"   # 00:13 winter / 01:13 zomer Amsterdam
    - cron: "41 1 * * *"    # 02:41 winter / 03:41 zomer
    - cron: "17 3 * * *"    # 04:17 winter / 05:17 zomer (vangnet)
    - cron: "3 17 * * 0"    # 18:03 Amsterdam op zondag — weekoverzicht
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write
  actions: read

# Eén run tegelijk per Gist-bestandsgroep: voorkomt dat twee workflows
# hetzelfde bestand lezen en elkaars wijzigingen overschrijven.
concurrency:
  group: gist-state
  cancel-in-progress: false

jobs:
  signup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto sign-up with calendar sync
        if: github.event.schedule != '3 17 * * 0'
        env:
          HUPPA_EMAIL: ${{ secrets.HUPPA_EMAIL }}
          HUPPA_PASSWORD: ${{ secrets.HUPPA_PASSWORD }}
          HUPPA_SUBDOMAIN: ${{ secrets.HUPPA_SUBDOMAIN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
          HUPPA_EMAIL_LAURA: ${{ secrets.HUPPA_EMAIL_LAURA }}
          HUPPA_PASSWORD_LAURA: ${{ secrets.HUPPA_PASSWORD_LAURA }}
          HUPPA_EMAIL_EVA: ${{ secrets.HUPPA_EMAIL_EVA }}
          HUPPA_PASSWORD_EVA: ${{ secrets.HUPPA_PASSWORD_EVA }}
        run: python3 autosignup.py --live --sync-calendar

      - name: Stuur weekoverzicht
        if: github.event.schedule == '3 17 * * 0'
        env:
          HUPPA_EMAIL: ${{ secrets.HUPPA_EMAIL }}
          HUPPA_PASSWORD: ${{ secrets.HUPPA_PASSWORD }}
          HUPPA_SUBDOMAIN: ${{ secrets.HUPPA_SUBDOMAIN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
        run: python3 autosignup.py --weekly-summary

      - name: Meld mislukte run
        if: failure()
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
        run: pip install -q requests pywebpush && python3 notify_failure.py
